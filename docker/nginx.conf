# Writes only to /tmp, so the root filesystem can be read-only.
# Logs carry no client IP addresses (docs/privacy.md).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format noip '[$time_local] "$request" $status $body_bytes_sent $request_time';
    access_log /dev/stdout noip;

    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        absolute_redirect off;
        log_not_found off;

        error_page 404 /404.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
